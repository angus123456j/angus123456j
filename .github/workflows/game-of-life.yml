
name: Conway's Game of Life

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: apoupon/gh-game-of-life@v1.1.0
        with:
          github-username: angus123456j
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game-of-life.gif'
          frames: '30'
          strategy: 'loop'
